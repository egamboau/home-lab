---
- name: Consultar paquetes para retirar los incompatibles con Docker CE
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - '--showformat=${db:Status-Status} ${Package}\n'
  register: docker_package_states
  changed_when: false
  check_mode: false

- name: Seleccionar paquetes incompatibles instalados
  ansible.builtin.set_fact:
    docker_conflicting_packages: >-
      {{ docker_package_states.stdout_lines
         | select('match', '^(installed|unpacked|half-configured|half-installed|triggers-awaited|triggers-pending) (docker[.]io|docker-cli|docker-compose|docker-compose-v2|docker-doc|docker-buildx|podman-docker|containerd|runc)$')
         | map('regex_replace', '^\S+ ', '') | list }}

- name: Retirar paquetes incompatibles sin purgar datos
  ansible.builtin.command:
    argv: "{{ ['dpkg', '--remove'] + docker_conflicting_packages }}"
  changed_when: true
  when: docker_conflicting_packages | length > 0

- name: Instalar certificados y SDK de Python
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-docker
    state: present
    fail_on_autoremove: true

- name: Crear directorio de claves APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Descargar la clave oficial de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Consultar arquitectura Debian
  ansible.builtin.command: dpkg --print-architecture
  register: docker_architecture
  changed_when: false
  check_mode: false

- name: Retirar la entrada antigua del repositorio Docker
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/docker.list
    regexp: '^\s*deb\s.*https?://download\.docker\.com/linux/debian\s'
    state: absent
    backup: true

- name: Configurar el repositorio Docker stable para Debian 13
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
    backup: true
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: trixie
      Components: stable
      Architectures: {{ docker_architecture.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Instalar la última versión estable de Docker CE y sus plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
    update_cache: true
    fail_on_autoremove: true

- name: Comprobar que dpkg terminó sin paquetes pendientes
  ansible.builtin.command: dpkg --audit
  register: docker_dpkg_audit
  changed_when: false
  failed_when: docker_dpkg_audit.rc != 0 or docker_dpkg_audit.stdout | trim | length > 0
  when: not ansible_check_mode
