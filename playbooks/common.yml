---
- name: Configurar hostname y mDNS en todos los servidores
  hosts: all
  become: true
  pre_tasks:
    - name: Validar Debian y hostname
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - server_hostname | default('') is match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
        fail_msg: Configura server_hostname como nombre corto único, sin .local.

  tasks:
    - name: Configurar el hostname del servidor
      ansible.builtin.hostname:
        name: '{{ server_hostname }}'
        use: systemd

    - name: Resolver el hostname localmente
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: '127.0.1.1 {{ server_hostname }}'

    - name: Instalar anuncio y resolución de nombres mDNS
      ansible.builtin.apt:
        name:
          - avahi-daemon
          - libnss-mdns
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Limitar Avahi a la interfaz LAN
      ansible.builtin.lineinfile:
        path: /etc/avahi/avahi-daemon.conf
        regexp: '^#?allow-interfaces='
        insertafter: '^\[server\]$'
        line: 'allow-interfaces={{ ansible_facts.default_ipv4.interface }}'
      notify: Reiniciar Avahi

    - name: Habilitar Avahi
      ansible.builtin.systemd_service:
        name: avahi-daemon
        enabled: true
        state: started

  handlers:
    - name: Reiniciar Avahi
      ansible.builtin.systemd_service:
        name: avahi-daemon
        state: restarted
